    why:
      title: "Por qué cuesta esto y no más"
      body: "Cada caso clínico se escribe una sola vez a partir de las Guías de Práctica Clínica y después sirve a todos los estudiantes sin costo adicional. No pagamos a un tutor de IA por cada pregunta que haces, así que no tenemos que cobrártelo. El precio no es una promoción: es lo que nos cuesta."
    faq:
      title: "Preguntas frecuentes"
      renewal:
        question: "¿Se renueva automáticamente?"
        answer: "No. Pagas una vez y el acceso termina en la fecha indicada. Si quieres más tiempo, compras otro periodo cuando lo decidas."
      stacking:
        question: "¿Qué pasa si compro con un periodo vigente?"
        answer: "El nuevo periodo empieza cuando termina el actual, así no pierdes ningún día por comprar antes."
      payment:
        question: "¿Cómo se paga?"
        answer: "En la página de pago segura de Stripe, nuestro procesador de pagos. Nunca vemos ni guardamos los datos de tu tarjeta."
      receipt:
        question: "¿Cuándo se activa mi acceso?"
        answer: "En cuanto Stripe confirma el pago, normalmente en segundos. Si elegiste pagar en efectivo, se activa cuando el pago se acredita."
      refunds:
        question: "¿Puedo pedir un reembolso?"
        answer: "Sí, en los términos de nuestra política de reembolsos."

