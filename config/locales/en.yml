      eyebrow: "Why it's different"
      title: "Questions you can check"
      citation:
        title: "Every answer cites its recommendation"
        body: "We don't say our questions are \"aligned\" with the GPCs: we show you the exact sentence the answer came from, with its evidence grade, the guideline's year and the path inside the guideline to find it."
      currency:
        title: "You know whether the guideline is still current"
