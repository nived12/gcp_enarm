    why:
      title: "Why it costs this and no more"
      body: "Each clinical case is written once from the Clinical Practice Guidelines and then serves every student at no extra cost. We don't pay an AI tutor for every question you ask, so we don't have to charge you for one. The price isn't a promotion: it's what it costs us."
    faq:
      title: "Frequently asked questions"
      renewal:
        question: "Does it renew automatically?"
        answer: "No. You pay once and access ends on the date shown. If you want more time, you buy another window whenever you decide to."
      stacking:
        question: "What if I buy while a window is still active?"
        answer: "The new window starts when the current one ends, so buying early never costs you a day."
      payment:
        question: "How do I pay?"
        answer: "On Stripe's secure payment page; Stripe is our payment processor. We never see or store your card details."
      receipt:
        question: "When does my access start?"
        answer: "As soon as Stripe confirms the payment, usually within seconds. If you chose to pay in cash, it starts when the payment clears."
      refunds:
        question: "Can I get a refund?"
        answer: "Yes, under the terms of our refund policy."

