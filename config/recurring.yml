# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# Study reminders. Students pick an hour of their own time zone, and zones are not all
# whole hours apart, so the job runs every quarter hour; each run sends only what is due
# and ReminderDelivery refuses a repeat. In development too: without RESEND_API_KEY the
# mail lands at /letter_opener, with it opted-in local accounts get real mail.
development:
  send_due_reminders: &send_due_reminders
    class: Reminders::DispatchJob
    queue: default
    schedule: every 15 minutes

production:
  send_due_reminders: *send_due_reminders

  # The GPC catalog is not frozen: guidelines are republished, new ones appear, and
  # every guideline ages out of its five-year validity window. Quarterly is the cadence
  # the source itself moves at, and it costs nothing — Solid Queue runs inside Puma.
  refresh_gpc_catalog:
    class: Gpc::RefreshCatalogJob
    queue: ingestion
    schedule: "0 3 1 1,4,7,10 *"

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
