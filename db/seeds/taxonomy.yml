# The filter axis and the study plan's backbone.
#
# Shape follows Dr. Re's temario — specialty, branch, named topic — because that is
# what a student recognises, but the content is ours: the four troncales and three
# transversal contexts the ENARM convocatoria names, filled from the GPC catalog and
# the exam blueprint rather than copied from anyone's curated list.
#
# Names are Spanish because they are data a student reads, not identifiers. Slugs are
# derived, not written. Aliases exist so Gpc::TopicLinker can match a guideline titled
# "cetoacidosis diabética" to the topic a student calls "complicaciones agudas".
